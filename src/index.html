<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caprasimo&family=Dancing+Script:wght@400..700&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Digital Art Portfolio</title>
</head>
<body class="gradient-body">
    <header>
        <h1><i class="fa-solid fa-star-half"></i>My Digital Art Portofolio<i class="fa-solid fa-star-half fa-flip-horizontal"></i></h1>
        <p>Showcasing my aesthetic creations </p>
        <!-- Bootstrap Fixed Navbar -->
        <nav class="navbar navbar-expand-md bg-white bg-opacity-75 shadow-sm py-2">
            <div class="container justify-content-center">
                <a class="navbar-brand d-none" href="#"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
                    <ul class="navbar-nav gap-2">
                        <li class="nav-item">
                            <a class="nav-link custom-nav-link px-4 py-2 rounded-2" href="#" id="home-link">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link custom-nav-link px-4 py-2 rounded-2" href="#" id="projects-link">My Projects</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main id="portfolio" class="rounded-4 shadow-lg p-4" style="margin-top: 90px;">
        <!-- Art cards will be injected here -->
    </main>
    <section id="add-art-section" style="display:none;">
        <h2>Add New Art</h2>
        <form id="add-art-form">
            <label for="art-title">Title:</label>
            <input type="text" id="art-title" name="art-title" required><br>
            <label for="art-image">Image:</label>
            <input type="file" id="art-image" name="art-image" accept="image/*" required><br>
            <label for="art-description">Description:</label>
            <textarea id="art-description" name="art-description" required></textarea><br>
            <button type="submit">Add Art</button>
        </form>
    </section>
    <footer>
        &copy; 2025 Faatihah. All rights reserved.
    </footer>
    <script src="scripts/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
